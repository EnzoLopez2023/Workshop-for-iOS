    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6040"/>
      <stop offset="0.48" stop-color="#c69a70"/>
      <stop offset="1" stop-color="#9d6d49"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">

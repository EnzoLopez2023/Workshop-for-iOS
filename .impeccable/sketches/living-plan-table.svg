<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e5e1"/>
      <stop offset="0.55" stop-color="#eef4f2"/>
      <stop offset="1" stop-color="#c8d9d5"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2f0"/>
      <stop offset="1" stop-color="#b9d0cb"/>

# Source of truth for Workshop.xcodeproj. Regenerate with `xcodegen generate`
# after changing files/capabilities. All signing/version/capability settings are
# encoded here so regeneration never loses state.
#
# Workshop native (Phase 1): SwiftUI REST client of the Azure backend
# (app-workshop-prod-lwxhu7jxlrbtu), dual auth (Entra MSAL + Sign in with Apple →
# server session), NintekKit shared foundation. Widgets target deferred to Phase 6.
#
# The Xcode target/product is "Workshop" (space-free); the repo folder stays
# "Workshop for iOS". Bundle id com.nintek.workshop.
name: Workshop
options:
  bundleIdPrefix: com.nintek
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  # Keep the remote revision committed so clean clones and CI resolve the same
  # code. For local NintekKit development, leave this entry intact and use
  # Xcode's File > Add Package Dependencies... > Add Local... to select a local
  # checkout. The matching local package temporarily overrides this dependency;
  # do not commit that project.pbxproj change, and delete the local reference to
  # return to the pinned remote revision.
  NintekKit:
    url: https://github.com/EnzoLopez2023/NintekKit
    revision: e425ea6b955c7a1599193fb94a8f0fba1ef16a48
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    exactVersion: "1.9.0"

# One shared app scheme so Xcode doesn't auto-create a run scheme per target.
schemes:
  Workshop:
    build:
      targets:
        Workshop: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - WorkshopTests
        - WorkshopUITests
  WorkshopWidgets:
    build:
      targets:
        WorkshopWidgetsExtension: all
  WorkshopShare:
    build:
      targets:
        WorkshopShareExtension: all

targets:
  Workshop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Workshop
        excludes:
          - "**/*.template"
          - "**/Info.plist"
          - "**/*.entitlements"
      - path: Shared
    dependencies:
      - package: NintekKit
      - package: MSAL
      # Home-screen widgets (WidgetKit extension, Phase 6.2). Embedded into the
      # app so it ships in the same bundle; shares data via the App Group.
      - target: WorkshopWidgetsExtension
        embed: true
      # "Add to Workshop" from Safari/Photos/Pinterest share sheets (Phase 7.5).
      - target: WorkshopShareExtension
        embed: true
    # MSAL is a prebuilt (stripped) binary SPM target, so Xcode can't generate
    # a dSYM for it and App Store Connect answers every upload with "Upload
    # Symbols Failed". Stage Microsoft's published dSYM into the archive.
    # No-ops on Debug builds. Kept identical to ShopKeep's copy.
    preBuildScripts:
      - script: '"$SRCROOT/Scripts/check-shipping-residue.sh"'
        name: Check Shipping Residue
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: '"$SRCROOT/Scripts/embed-msal-dsym.sh"'
        name: Stage MSAL dSYM
        basedOnDependencyAnalysis: false
    info:
      path: Workshop/Info.plist
      properties:
        CFBundleDisplayName: Workshop
        CFBundleIconName: AppIcon
        # Version comes from the build settings below (single source of truth),
        # not literals — otherwise xcodegen defaults the plist back to 1.0 (1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Workshop only ever talks HTTPS/TLS (standard exemption) — declaring
        # this skips the export-compliance question App Store Connect asks on
        # every TestFlight build otherwise.
        ITSAppUsesNonExemptEncryption: false
        # Required for the Phase 7.1 "tracking cuts" Live Activity.
        NSSupportsLiveActivities: true
        # "Background fetch" — required alongside BGTaskSchedulerPermittedIdentifiers
        # for a BGAppRefreshTaskRequest to actually run (keeps widgets from going
        # stale between app opens; see Workshop/App/BackgroundRefresh.swift).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.nintek.workshop.refresh
        # Home Screen long-press quick actions, handled on cold launch by
        # AppDelegate (see DESIGN.md / plan doc for the warm-relaunch caveat).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.nintek.workshop.newproject
            UIApplicationShortcutItemTitle: New Project
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.nintek.workshop.shoppinglist
            UIApplicationShortcutItemTitle: Shopping List
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
        # Handoff — continue viewing a project across iPhone/iPad/Mac.
        NSUserActivityTypes:
          - com.nintek.workshop.viewing-project
        # Camera for project sketches and build-log photos. The photo library
        # is only ever reached through `PhotosPicker`, which runs out of process
        # and hands back just the chosen image — that needs no usage string, and
        # declaring one anyway asks for access the app never uses. Files/PDF
        # import needs no string either.
        NSCameraUsageDescription: Workshop uses the camera to photograph your projects and build progress.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # MSAL redirect: msauth.<bundleid>://auth — must match the iOS redirect URI
        # registered on the Workshop Entra app registration (Enzo to add, Phase 0.1).
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.nintek.workshop
            CFBundleURLSchemes:
              - msauth.com.nintek.workshop
          # Widget/deep links: workshop://project/<id>, workshop://dashboard …
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.nintek.workshop.deeplink
            CFBundleURLSchemes:
              - workshop
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
    entitlements:
      path: Workshop/Workshop.entitlements
      properties:
        # MSAL token cache + Apple session Keychain item.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.nintek.workshop
        # Sign in with Apple (alongside Microsoft). Requires the capability
        # enabled on the App ID in the Apple Developer portal.
        com.apple.developer.applesignin:
          - Default
        # Shared with WorkshopWidgetsExtension — the widget snapshot hand-off.
        com.apple.security.application-groups:
          - group.com.nintek.workshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nintek.workshop
        PRODUCT_NAME: Workshop
        # Single source of truth for the app version — Info.plist references these
        # via $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION). Bump every commit:
        # marketing = major.minor.patch (semver), build = monotonic per commit.
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3KB968X34U"

  WorkshopWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkshopWidgets
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
      - path: Shared/LivingPlanTokens.swift
    dependencies:
      - package: NintekKit
    info:
      path: WorkshopWidgets/Info.plist
      properties:
        CFBundleDisplayName: Workshop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required for WidgetKit extensions — App Store validation (error 90348)
        # rejects the build without it. Must live here because xcodegen
        # regenerates this Info.plist from these properties (so a hand-edited
        # NSExtension in the file on disk would be overwritten).
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WorkshopWidgets/WorkshopWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nintek.workshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nintek.workshop.widgets
        PRODUCT_NAME: WorkshopWidgets
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3KB968X34U"
    preBuildScripts:
      - script: '"$SRCROOT/Scripts/check-shipping-residue.sh"'
        name: Check Shipping Residue
        basedOnDependencyAnalysis: false

  WorkshopShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkshopShareExtension
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
      - path: Shared
    dependencies:
      - package: NintekKit
    info:
      path: WorkshopShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Workshop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: WorkshopShareExtension/WorkshopShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nintek.workshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nintek.workshop.share
        PRODUCT_NAME: WorkshopShareExtension
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3KB968X34U"
    preBuildScripts:
      - script: '"$SRCROOT/Scripts/check-shipping-residue.sh"'
        name: Check Shipping Residue
        basedOnDependencyAnalysis: false

  WorkshopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkshopTests
    dependencies:
      - target: Workshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nintek.workshop.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3KB968X34U"

  WorkshopUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkshopUITests
    dependencies:
      - target: Workshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nintek.workshop.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "3KB968X34U"
